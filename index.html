<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamMatch — поиск команд</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Шапка -->
<header class="header">
    <div class="header__logo">⚡ TeamMatch</div>
    <nav class="header__nav" id="mainNav">
        <a href="#" data-screen="feed" class="nav-link active">Лента</a>
        <a href="#" data-screen="profile" class="nav-link">Мой профиль</a>
        <a href="#" data-screen="create" class="nav-link">Создать проект</a>
    </nav>
    <div class="header__actions">
        <button class="notification-btn" id="notificationBtn" title="Уведомления">
            🔔
            <span class="badge" id="notificationBadge" style="display: none;">0</span>
        </button>
        <div class="user-switcher">
            <button class="user-switcher__current" id="userSwitcherBtn">
                <span id="currentUserName">Гость</span> ▾
            </button>
            <div class="user-switcher__dropdown" id="userSwitcherDropdown">
                <!-- Заполняется из JS -->
            </div>
        </div>
        <button class="logout-btn" id="logoutBtn" style="display: none;">Выйти</button>
    </div>
</header>

<!-- Основной контент -->
<main class="main">
    <!-- Экран авторизации -->
    <section id="screen-auth" class="screen active">
        <div class="auth-container">
            <h2>Добро пожаловать в TeamMatch</h2>
            <p class="auth-subtitle">Платформа для поиска команд и проектов</p>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Введите email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
            </form>
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="Введите email" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" placeholder="Придумайте пароль" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
            </form>
            <div class="demo-hint">
                <p>Демо-пользователи:</p>
                <p>Артём: artem@example.com / 123</p>
                <p>Дима: dima@example.com / 123</p>
                <p>Аня: anya@example.com / 123</p>
            </div>
        </div>
    </section>

    <!-- Экран ленты проектов -->
    <section id="screen-feed" class="screen">
        <div class="screen-header">
            <h1>Лента проектов</h1>
            <button class="btn btn-primary" id="createProjectBtn">+ Создать проект</button>
        </div>
        <div class="projects-grid" id="projectsGrid">
            <!-- Карточки проектов -->
        </div>
    </section>

    <!-- Экран профиля -->
    <section id="screen-profile" class="screen">
        <div id="profileContainer">
            <!-- Динамически заполняется -->
        </div>
    </section>

    <!-- Экран создания проекта -->
    <section id="screen-create" class="screen">
        <div class="screen-header">
            <h1>Создать проект</h1>
        </div>


<form id="createProjectForm" class="project-form">
            <div class="form-group">
                <label for="projectTitle">Название проекта</label>
                <input type="text" id="projectTitle" placeholder="Например: Умный будильник" required>
            </div>
            <div class="form-group">
                <label for="projectDescription">Описание</label>
                <textarea id="projectDescription" rows="4" placeholder="Опишите ваш проект, цели, сроки" required></textarea>
            </div>
            <div class="form-group">
                <label>Роли в команде</label>
                <div id="rolesContainer">
                    <div class="role-row">
                        <input type="text" placeholder="Название роли" class="role-title" value="Мобильный разработчик (Flutter)" required>
                        <input type="number" placeholder="Кол-во" min="1" value="1" class="role-count" required>
                        <button type="button" class="remove-role" title="Удалить роль">×</button>
                    </div>
                </div>
                <button type="button" id="addRoleBtn" class="btn btn-secondary">+ Добавить роль</button>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Опубликовать проект</button>
        </form>
    </section>

    <!-- Экран детального просмотра проекта -->
    <section id="screen-project-detail" class="screen">
        <div id="projectDetailContainer">
            <!-- Динамически заполняется -->
        </div>
    </section>
</main>

<!-- Модальное окно уведомлений -->
<div class="modal-overlay" id="notificationsModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Уведомления</h2>
            <button class="modal-close" id="closeNotificationsBtn">✕</button>
        </div>
        <div id="notificationsList">
            <!-- Список заявок -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="closeNotificationsBtn2">Закрыть</button>
        </div>
    </div>
</div>

<!-- Модальное окно профиля пользователя -->
<div class="modal-overlay" id="userProfileModal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Профиль участника</h2>
            <button class="modal-close" id="closeUserProfileBtn">✕</button>
        </div>
        <div id="userProfileContent">
            <!-- Данные профиля -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="closeUserProfileBtn2">Закрыть</button>
        </div>
    </div>
</div>

<script src="src/js/script.js"></script>
</body>
</html>
